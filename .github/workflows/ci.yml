name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift
    # A Mac we own rather than macos-26, and the reason is arithmetic. GitHub
    # bills macOS at ten times the multiplier, so this one job -- which boots a
    # simulator and runs UI tests, the most expensive shape there is -- spent
    # 187 minutes in August and 1,870 of the organisation's 2,000-minute
    # monthly allowance. The other two repositories' Linux jobs came to 66.
    # Past the allowance nothing is dispatched at all: every job in every
    # repository failed in three seconds with no runner assigned and no log to
    # say why, from 28 July until this changed. Three weeks of commits, the
    # whole of proof of possession among them, went unchecked.
    #
    # The cost of the fix is that a queued job now waits for a machine that
    # sleeps. An offline runner queues rather than fails, so a red X becomes a
    # pending circle -- quieter and easier to miss than a failure.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7

      # Asserts the requirement, not a version string. What the build actually
      # needs is an iOS 26 SDK -- the deployment floor is 26, and SwiftPM must
      # be new enough to parse `.v26` at all -- so that is what gets checked.
      # Naming an exact Xcode here instead would rot at the next upgrade and
      # fail with "not found" rather than with the reason.
      #
      # DEVELOPER_DIR rather than `sudo xcode-select`, which is what a hosted
      # image could afford: switching it there changed a machine that was about
      # to be destroyed, and here it would change the one somebody is working
      # on. There is also no TTY under launchd for sudo to ask on.
      - name: Toolchain
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          export DEVELOPER_DIR="$latest/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          sdk=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9]*\).*/\1/p' | sort -n | tail -1)
          if [ -z "$sdk" ] || [ "$sdk" -lt 26 ]; then
            echo "::error::need an iOS 26 SDK, newest on this machine is '${sdk:-none}' ($latest)"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          swift --version && xcodebuild -version

      # The package builds for macOS, so the shared logic -- rooms, layer
      # selection, the session machine -- is tested on the host rather than in a
      # simulator, which is faster and where all but the UI tests live.
      - name: Build and test the package
        run: |
          swift build
          swift test

      # The point of the sample living here. It depends on MoqomKit by path, so
      # this step builds it against the working tree: an SDK change that breaks
      # the sample fails now rather than after a release.
      # Installed once on a machine that keeps things, so this asks rather than
      # installs. `brew install` on a formula already present is a no-op that
      # still talks to the network, which is a slow way to do nothing on every
      # push and a way to fail when the network is the thing that is broken.
      - name: Install xcodegen and xcbeautify
        run: |
          for tool in xcodegen xcbeautify; do
            brew list "$tool" >/dev/null 2>&1 || brew install "$tool"
          done

      # project.yml is the source and the pbxproj is generated, so this also
      # confirms the generator still agrees with the file.
      - name: Generate the sample project
        working-directory: Samples/MoqomRoom
        run: xcodegen generate

      # Booted explicitly rather than letting xcodebuild pick, so a machine that
      # has a different set of devices on it fails here with a clear message
      # instead of somewhere inside the test run.
      - name: Boot a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          # Runtime identifiers look like com.apple.CoreSimulator.SimRuntime.iOS-26-2.
          # An iOS 17 device would install fine and then fail to launch an app
          # built for 26, so the floor is enforced when picking, not after.
          runtimes = sorted(
              (rt for rt in devices if '.iOS-' in rt and int(rt.split('.iOS-')[1].split('-')[0]) >= 26),
              key=lambda rt: [int(p) for p in rt.split('.iOS-')[1].split('-')],
              reverse=True,
          )
          for rt in runtimes:
              for dev in devices[rt]:
                  if 'iPhone' in dev['name']:
                      print(dev['udid'])
                      sys.exit(0)
          sys.exit('no iOS 26+ iPhone simulator on this machine')
          ")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # Already booted is the ordinary case now, not an error: the previous
          # run left it that way, or the person who owns this Mac did. Boot is
          # allowed to fail and bootstatus is what actually has to pass, since
          # it reports readiness either way.
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b

      # The only place the SwiftUI layer runs, and the only place the sample's
      # own unit tests run at all -- they are an Xcode target, so `swift test`
      # above never sees them.
      #
      # MoqomRoom, not MoqomRoomUITests. Both test bundles hang off the app's
      # scheme via project.yml's `scheme.testTargets`, and xcodegen generates no
      # scheme of their own, so the name this used to carry had never existed.
      # xcodebuild's answer to that is exit 65 and "does not contain a scheme",
      # which is indistinguishable in a summary from a test that failed -- and
      # nobody read the summary, because minutes ran out a week later and the
      # job stopped starting.
      #
      # Signing left alone rather than switched off. CODE_SIGNING_ALLOWED=NO
      # produces a bundle with no entitlements, and with no entitlements there
      # is no keychain group, so `DeviceKey` cannot store the key it just
      # generated: the app came up saying it could hold no key at all. A
      # simulator needs no team, only the ad-hoc identity it gets by default.
      #
      # pipefail is load-bearing. Without it the pipeline reports xcbeautify's
      # exit code, xcodebuild's failure is discarded, and the job goes green on
      # a broken build -- which is worse than having no job at all.
      - name: Run the sample's tests
        working-directory: Samples/MoqomRoom
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project MoqomRoom.xcodeproj \
            -scheme MoqomRoom \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            | xcbeautify --renderer github-actions
        env:
          NSUnbufferedIO: YES

      # The disk here is shared with the person using the Mac, and it is the
      # scarce resource: a build was already lost this month to a full one, with
      # DerivedData among what had to be deleted to recover. So the build
      # products go somewhere named and are removed, rather than accumulating
      # under ~/Library where nothing ever looks. Shutting the simulator down
      # costs the next run a boot and saves a few hundred megabytes of a device
      # nobody is watching.
      - name: Give the machine back
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/DerivedData"
          udid="${{ steps.sim.outputs.udid }}"
          if [ -n "$udid" ]; then xcrun simctl shutdown "$udid" 2>/dev/null || true; fi
