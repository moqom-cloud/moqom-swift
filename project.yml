# XcodeGen project definition.
#
# Chosen over a checked-in .xcodeproj because a pbxproj is thousands of lines of
# generated UUIDs that could not be validated here — `xcode-select` points at
# the Command Line Tools, so no iOS project can be opened or built in this
# environment. A broken pbxproj fails in ways that are tedious to diagnose; this
# file is forty lines a human can read and correct.
#
# Chosen over a Package.swift executable because a SwiftPM executable cannot be
# an iOS app: no bundle, no Info.plist, no camera usage description, no
# entitlements. The app target has to be an Xcode target.
#
#   brew install xcodegen
#   cd samples/ios && xcodegen generate && open MoqomRoom.xcodeproj
#
# The sample's Swift sources do typecheck — see sdk/ios/README.md for how they
# were verified against the macOS SDK without Xcode.

name: MoqomRoom

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Signing lives in an xcconfig rather than here, so the one value that is
# personal — the Team ID — sits in a gitignored file instead of in the
# repository. See Signing.xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

packages:
  MoqomKit:
    # Relative to this file. The SDK is in the same repository rather than
    # pinned to a version, because the two move together for now.
    path: ../../sdk/ios

targets:
  MoqomRoom:
    type: application
    platform: iOS
    sources:
      - path: MoqomRoom/Sources
    dependencies:
      - package: MoqomKit
        product: MoqomKit
      - package: MoqomKit
        product: MoqomLoopback
    info:
      path: MoqomRoom/Info.plist
      properties:
        CFBundleDisplayName: MOQOM
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Present even though the sample publishes synthetic frames: switching
        # `RoomModel.startBroadcast` to `CameraSource` is a one-line change and
        # the app would otherwise be terminated on the first capture attempt.
        NSCameraUsageDescription: Publish your camera to the room.
        NSMicrophoneUsageDescription: Publish your microphone to the room.
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # Not repeated here: PRODUCT_BUNDLE_IDENTIFIER, DEVELOPMENT_TEAM, and
        # CODE_SIGN_STYLE. A target-level setting beats an xcconfig, so naming
        # any of them would silently defeat Local.xcconfig.
