# XcodeGen project definition.
#
# Chosen over a checked-in .xcodeproj because a pbxproj is thousands of lines of
# generated UUIDs, and a broken one fails in ways that are tedious to diagnose.
# This file is eighty lines a human can read and correct.
#
# Chosen over a Package.swift executable because a SwiftPM executable cannot be
# an iOS app: no bundle, no Info.plist, no camera usage description, no
# entitlements. The app target has to be an Xcode target.
#
#   brew install xcodegen
#   cd Samples/MoqomRoom && xcodegen generate && open MoqomRoom.xcodeproj
#
# Needs an Xcode with an iOS 26 SDK: the deployment floor below is 26, which is
# what lets the SDK use customPostProcessing and NetworkConnection<QUIC> without
# a single availability check. See the repository README.

name: MoqomRoom

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

# Signing lives in an xcconfig rather than here, so the one value that is
# personal — the Team ID — sits in a gitignored file instead of in the
# repository. See Signing.xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

packages:
  MoqomKit:
    # The repository root, relative to this file. A path dependency rather than
    # a version is the whole reason the sample lives in this repo: it builds
    # against working-tree MoqomKit, so a breaking SDK change fails CI here
    # instead of after a release.
    path: ../..

targets:
  MoqomRoom:
    type: application
    platform: iOS
    sources:
      - path: MoqomRoom/Sources
    dependencies:
      - package: MoqomKit
        product: MoqomKit
      - package: MoqomKit
        product: MoqomLoopback
      # Embeds the extension in the app. A Live Activity whose extension is not
      # inside the bundle fails at `Activity.request` with an error that names
      # the attributes type rather than the missing extension.
      - target: MoqomRoomWidgets
    info:
      path: MoqomRoom/Info.plist
      properties:
        CFBundleDisplayName: MOQOM
        # Dark is set here rather than with `.preferredColorScheme(.dark)` so
        # that it covers what SwiftUI does not: the launch screen, the keyboard,
        # and system alerts. A modifier on the root scene leaves those light and
        # the app flashes white on every cold start.
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Present even though the sample publishes synthetic frames: switching
        # `RoomModel.startBroadcast` to `CameraSource` is a one-line change and
        # the app would otherwise be terminated on the first capture attempt.
        NSCameraUsageDescription: Publish your camera to the room.
        NSMicrophoneUsageDescription: Publish your microphone to the room.
        # A relay on a desk is on a private address, and iOS blackholes traffic to
        # those until this string exists to be shown in a prompt. Without it the
        # connection does not fail: it hangs, which reads as a relay that is down.
        NSLocalNetworkUsageDescription: >-
          Connect to a relay running on your own network, for development.
        # Browsing is gated separately from connecting, and only for types listed
        # here — an unlisted type returns no results at all rather than an error,
        # so a pairing code would simply never be found.
        NSBonjourServices:
          - _moqom-relay._udp
        # Required for Picture in Picture, and not optional in the way the name
        # suggests: without it the system refuses to start the window, and the
        # refusal arrives as a delegate error rather than as a build failure.
        # It is the same key that keeps room audio running when backgrounded.
        UIBackgroundModes:
          - audio
        # Lets the app start a Live Activity at all.
        NSSupportsLiveActivities: true
        # How a phone with no Mac attached gets a relay address, a certificate
        # hash and a credential: `deploy/tools/invite.sh` prints a QR code
        # holding a `moqom://join?...`, and the Camera app opens it here. See
        # `Invitation.swift` and `RelayInvitation` in the SDK.
        #
        # A custom scheme rather than a universal link, which would be the right
        # answer for a shipping app: a universal link needs a domain serving an
        # apple-app-site-association file, and it cannot be claimed by another
        # app the way a scheme can. This is a sample, and the thing being
        # demonstrated is what the app does with the link once it has it.
        CFBundleURLTypes:
          - CFBundleURLName: cloud.moqom.room.invitation
            CFBundleURLSchemes:
              - moqom
        # Not set: NSSupportsLiveActivitiesFrequentUpdates. The throttle in
        # `BroadcastActivityThrottle` is built to live inside the ordinary
        # budget, and asking for the larger one would hide whether it does.
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # Not repeated here: PRODUCT_BUNDLE_IDENTIFIER, DEVELOPMENT_TEAM, and
        # CODE_SIGN_STYLE. A target-level setting beats an xcconfig, so naming
        # any of them would silently defeat Local.xcconfig.

  # Draws the Lock Screen card and the Dynamic Island. Out of process, which is
  # why it links MoqomKit for `MoqomBroadcastAttributes` rather than sharing
  # anything with the app at runtime.
  MoqomRoomWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MoqomRoomWidgets
    dependencies:
      - package: MoqomKit
        product: MoqomKit
    info:
      path: MoqomRoomWidgets/Info.plist
      properties:
        CFBundleDisplayName: MOQOM
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # As with the UI test bundle: one identifier per bundle, and the
        # extension's must be prefixed by the app's or it will not embed.
        PRODUCT_BUNDLE_IDENTIFIER: $(MOQOM_BUNDLE_PREFIX).room.widgets

  # The only place the SwiftUI layer is executed. MoqomKit's 103 tests drive
  # RoomSession directly and never render, so the @Observable bridge and the
  # phase switch had no coverage until this existed.
  MoqomRoomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MoqomRoomUITests
    dependencies:
      - target: MoqomRoom
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: MoqomRoom
        # A test bundle has no Info.plist of its own in this repository, so it
        # needs the generated one. Without this the target cannot be signed and
        # the failure names code signing rather than the missing plist.
        GENERATE_INFOPLIST_FILE: YES
        # Overridden because Signing.xcconfig sets one identifier for the whole
        # project and two bundles cannot share it. Team and signing style are
        # deliberately still left to the xcconfig.
        PRODUCT_BUNDLE_IDENTIFIER: $(MOQOM_BUNDLE_PREFIX).room.uitests
